<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heaven Architects</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; padding:40px 20px; }
  #youtube-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .yt-box { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  .yt-box iframe { width:100%; height:100%; border:0; }
  @media (max-width:768px) { #youtube-row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="youtube-row">
  <div class="yt-box">
    <iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen loading="lazy"></iframe>
  </div>
  <div class="yt-box">
    <iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ&amp;index=2" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen loading="lazy"></iframe>
  </div>
  <div class="yt-box">
    <iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ&amp;index=3" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen loading="lazy"></iframe>
  </div>
</div>
</body>
</html>
