<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heaven Architects</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; padding: 40px 20px; }
  #youtube-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .yt-box { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; position: relative; }
  .yt-box iframe { width: 100%; height: 100%; border: 0; }
  @media (max-width: 768px) { #youtube-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="youtube-row">
  <div class="yt-box">
    <iframe referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
  </div>
  <div class="yt-box">
    <iframe referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
  </div>
  <div class="yt-box">
    <iframe referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
  </div>
</div>

<script>
  const PLAYLIST_ID = 'UUpnU9f5UwOw8Jfa9iEKlqBQ';
  const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`;

  // Extract 11-character YouTube video IDs directly from raw XML text
  function extractVideoIdsFromXml(xmlText) {
    const matches = [...xmlText.matchAll(/<yt:videoId>([^<]+)<\/yt:videoId>/g)];
    return matches.map(m => m[1]).slice(0, 3);
  }

  async function loadLatestVideos() {
    const iframes = document.querySelectorAll('#youtube-row iframe');
    let videoIds = [];

    // List of fallback methods so if one proxy blocks github.io, the next one works
    const fetchMethods = [
      // Method 1: CodeTabs CORS Proxy (Raw XML)
      async () => {
        const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}`);
        if (!res.ok) throw new Error('CodeTabs failed');
        return extractVideoIdsFromXml(await res.text());
      },
      // Method 2: AllOrigins JSON Wrapper
      async () => {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`);
        if (!res.ok) throw new Error('AllOrigins failed');
        const data = await res.json();
        return extractVideoIdsFromXml(data.contents);
      },
      // Method 3: rss2json
      async () => {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        if (!res.ok) throw new Error('rss2json failed');
        const data = await res.json();
        return data.items.slice(0, 3).map(item => {
          const match = (item.link || '').match(/[?&]v=([^&]+)/);
          return match ? match[1] : item.guid.split(':').pop();
        });
      }
    ];

    for (const method of fetchMethods) {
      try {
        const ids = await method();
        if (ids && ids.length > 0) {
          videoIds = ids;
          break;
        }
      } catch (err) {
        console.warn('Proxy attempt failed, trying next...', err);
      }
    }

    // Fallback: If all proxies are down, at least render the playlist so boxes aren't black
    if (videoIds.length === 0) {
      console.error('All proxies failed. Falling back to default playlist embed.');
      iframes.forEach((iframe, i) => {
        iframe.src = `https://www.youtube.com/embed/videoseries?list=${PLAYLIST_ID}&index=${i}`;
      });
      return;
    }

    // Populate the 3 iframes with the 3 distinct video IDs
    videoIds.forEach((id, index) => {
      if (iframes[index] && id) {
        iframes[index].src = `https://www.youtube.com/embed/${id}`;
        iframes[index].allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      }
    });
  }

  loadLatestVideos();
</script>

</body>
  </html>
