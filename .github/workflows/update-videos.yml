name: Update YouTube Videos

on:
  schedule:
    - cron: '0 */4 * * *' # Runs automatically every 4 hours
  workflow_dispatch:      # Lets you trigger it manually with 1 click
  push:
    branches: [ main, master ]

permissions:
  contents: write         # Gives the bot permission to save videos.json

jobs:
  fetch-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch YouTube XML and save to videos.json
        run: |
          python3 -c "
          import urllib.request, xml.etree.ElementTree as ET, json

          url = 'https://www.youtube.com/feeds/videos.xml?playlist_id=UUpnU9f5UwOw8Jfa9iEKlqBQ'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          xml_data = urllib.request.urlopen(req).read()

          root = ET.fromstring(xml_data)
          ns = {
              'atom': 'http://www.w3.org/2005/Atom',
              'yt': 'http://www.youtube.com/xml/schemas/2015',
              'media': 'http://search.yahoo.com/mrss/'
          }

          videos = []
          for entry in root.findall('atom:entry', ns)[:3]:
              vid_el = entry.find('yt:videoId', ns)
              title_el = entry.find('atom:title', ns)
              pub_el = entry.find('atom:published', ns)
              stats_el = entry.find('.//media:statistics', ns)

              vid = vid_el.text if vid_el is not None else ''
              if vid:
                  videos.append({
                      'id': vid,
                      'title': title_el.text if title_el is not None else '',
                      'published': pub_el.text if pub_el is not None else '',
                      'views': stats_el.attrib.get('views', '0') if stats_el is not None else '0'
                  })

          with open('videos.json', 'w', encoding='utf-8') as f:
              json.dump(videos, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and push videos.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || (git commit -m "Auto-update latest YouTube videos" && git push)
